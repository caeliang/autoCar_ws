# Waypoint takip sistemi v5 — parametreler
# Bu dosyayı launch parametreleri ile override edebilirsin

waypoint_manager:
  ros__parameters:
    waypoint_file: ""          # CSV dosya yolu
    frame_id: "map"
    goal_tolerance: 1.5        # m — waypoint'e ulaşıldı mesafesi
    loop: false                # hedefe ulaştığında dursun (döngü kapalı)
    publish_rate: 10.0         # Hz
    path_horizon: 50           # ilerideki kaç waypoint path'e dahil edilsin
    start_from_first: true     # planlı rotada en yakın WP'ye atlama; CSV başından başla
    resync_window: 120         # araç rota üzerinde ileri kaçtıysa bu pencere içinde tekrar yakala
    resync_distance: 3.0       # m — route resync için maksimum yakınlık

pure_pursuit:
  ros__parameters:
    max_speed: 2.0             # m/s — düz yolda hız
    min_speed: 0.3             # m/s — minimum ileri hız
    min_lookahead: 1.5         # m — minimum lookahead mesafesi
    max_lookahead: 5.0         # m — maximum lookahead mesafesi
    lookahead_ratio: 1.5       # speed × ratio = dinamik lookahead
    max_omega: 1.0             # rad/s — maksimum açısal hız
