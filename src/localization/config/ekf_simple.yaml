# Simple EKF Configuration for Prius Vehicle
# Fuses: Odometry + IMU

/**:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    
    # TF frames - chassis is the robot base frame from Gazebo
    map_frame: map
    odom_frame: odom
    base_link_frame: chassis
    world_frame: odom
    
    # TF publishing
    publish_tf: true
    publish_acceleration: true
    permit_corrected_publication: false
    
    # Odometry input - /prius/odom
    odom0: /prius/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    
    # IMU input - /prius/imu
    imu0: /prius/imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
